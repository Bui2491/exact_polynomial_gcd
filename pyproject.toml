[project]
name = "exact-polynomial-gcd"
version = "0.1.0"
description = "Computes the greatest common divisor of two polynomials with rational coefficients using the Euclidean algorithm over Fraction."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
